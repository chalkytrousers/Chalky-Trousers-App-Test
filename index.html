<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CT Scoreboard">
    <link rel="apple-touch-icon" href="assets/logo-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <title>Chalky Trousers - v11.7</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #000000;
            --banner-bg: #111111;
            --accent-green: #22ff6d;
            --border-color: rgba(255, 255, 255, 0.1);
            --nav-h: 50px;
            --info-bar-h: 40px;
        }

        * { 
            box-sizing: border-box; 
            user-select: none !important; 
            -webkit-user-select: none !important; 
            touch-action: none; 
            transform: translateZ(0);
        }

        [contenteditable] { user-select: text !important; -webkit-user-select: text !important; touch-action: auto !important; }

        body, html {
            margin: 0; padding: 0; 
            height: 100dvh; width: 100vw;
            background-color: var(--bg-dark);
            color: white; font-family: 'Chakra Petch', sans-serif;
            overflow: hidden; position: fixed;
        }

        .app-container {
            display: flex; flex-direction: column;
            height: 100dvh; width: 100%;
            padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
        }

        /* TOP NAV: Integrating Logo into the header */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; background: var(--banner-bg); border-bottom: 1px solid var(--border-color);
            padding-top: env(safe-area-inset-top); height: calc(var(--nav-h) + env(safe-area-inset-top));
            flex-shrink: 0;
        }

        .header-logo { height: 24px; width: auto; opacity: 0.9; }
        
        .btn-group { display: flex; gap: 8px; align-items: center; }
        
        .nav-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
            color: #ccc; padding: 6px 12px; border-radius: 6px; font-size: 0.7rem; 
            cursor: pointer; font-weight: 700;
        }
        .nav-btn.fs-btn { border-color: rgba(255,255,255,0.4); color: #fff; }
        .nav-btn.reset { background: rgba(255, 68, 68, 0.1); border-color: rgba(255, 68, 68, 0.3); color: #ff4444; }

        /* NAMES BAR */
        .names-row { display: flex; height: clamp(45px, 10vh, 80px); background: #080808; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .name-slot { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            font-size: clamp(1.2rem, 4.5vh, 4rem); font-weight: 900; 
            text-transform: uppercase; color: #555; transition: color 0.3s ease;
        }
        .name-slot.breaking { color: var(--accent-green); text-shadow: 0 0 15px rgba(34, 255, 109, 0.4); }

        /* MAIN SCORE AREA: Purely functional */
        .scores-main { display: flex; flex: 1; width: 100%; position: relative; }
        .score-pane { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            height: 100%; position: relative;
        }
        
        .score-num { 
            font-size: clamp(8rem, 58vh, 60rem); font-weight: 700; line-height: 1; 
            cursor: pointer; color: white; will-change: contents; 
        }

        .divider { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 60%; width: 1px; background: var(--border-color); pointer-events: none; }

        /* INFO BAR */
        .info-bar { 
            display: flex; justify-content: center; align-items: center; gap: 30px;
            background: var(--banner-bg); border-top: 1px solid var(--border-color);
            flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom);
            height: calc(var(--info-bar-h) + env(safe-area-inset-bottom));
        }
        .info-item { display: flex; align-items: center; gap: 10px; }
        .info-label { font-size: 0.65rem; font-weight: 900; color: #666; text-transform: uppercase; }
        .info-select { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 2px 8px; border-radius: 4px; font-family: inherit; font-size: 0.75rem; font-weight: 700; appearance: none; -webkit-appearance: none; text-align: center; }

        #orientation-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; }
        @media screen and (orientation: portrait) { #orientation-overlay { display: flex; } .app-container { display: none; } }
    </style>
</head>
<body>
    <div id="orientation-overlay"><h2>ROTATE TO LANDSCAPE</h2></div>
    <div class="app-container">
        <header class="top-nav">
            <img src="https://chalkytrousers.github.io/Chalky-Trousers-App-Android/assets/ct-logo-text.png" class="header-logo" alt="Chalky Trousers">
            <div class="btn-group">
                <button class="nav-btn undo" id="undo-btn" style="visibility:hidden;">Undo</button>
                <button class="nav-btn fs-btn" id="fs-toggle">⛶ Fullscreen</button>
                <button class="nav-btn reset" id="reset-btn">Reset</button>
            </div>
        </header>

        <nav class="names-row">
            <div class="name-slot breaking" id="p1-txt" contenteditable="true" spellcheck="false" onblur="saveDebounced()" onpointerdown="setBreak(1)">PLAYER 1</div>
            <div class="name-slot" id="p2-txt" contenteditable="true" spellcheck="false" onblur="saveDebounced()" onpointerdown="setBreak(2)">PLAYER 2</div>
        </nav>

        <main class="scores-main">
            <div class="divider"></div>
            <section class="score-pane">
                <div class="score-num" id="s1" onpointerdown="scStart(event, 's1')" onpointerup="scEnd(event, 's1')">0</div>
            </section>
            <section class="score-pane">
                <div class="score-num" id="s2" onpointerdown="scStart(event, 's2')" onpointerup="scEnd(event, 's2')">0</div>
            </section>
        </main>

        <div class="info-bar">
            <div class="info-item">
                <span class="info-label">RACE TO</span>
                <select id="race-to-select" class="info-select" onchange="saveDebounced()"><option value="-">-</option></select>
            </div>
            <div class="info-item">
                <span class="info-label">RULES</span>
                <select id="ruleset-select" class="info-select" onchange="saveDebounced()">
                    <option value="uk8">uk8</option><option value="wpa">wpa</option><option value="ultimate">ultimate</option><option value="custom">custom</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const KEY = 'ct_v11_data';
        let breakSide = 1; let lastState = null; let undoTimeout = null; let saveTimer = null;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => { console.log(`FS Error: ${err.message}`); });
            } else {
                document.exitFullscreen();
            }
        }

        function saveDebounced() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 200); }
        function save() { const d = { s1: document.getElementById('s1').innerText, s2: document.getElementById('s2').innerText, p1: document.getElementById('p1-txt').innerText.trim(), p2: document.getElementById('p2-txt').innerText.trim(), side: breakSide, rules: document.getElementById('ruleset-select').value, race: document.getElementById('race-to-select').value }; localStorage.setItem(KEY, JSON.stringify(d)); }
        function load() { const s = localStorage.getItem(KEY); if (s) { const d = JSON.parse(s); document.getElementById('s1').innerText = d.s1 || "0"; document.getElementById('s2').innerText = d.s2 || "0"; document.getElementById('p1-txt').innerText = d.p1 || "PLAYER 1"; document.getElementById('p2-txt').innerText = d.p2 || "PLAYER 2"; breakSide = d.side || 1; updateBreakVisual(); document.getElementById('ruleset-select').value = d.rules || "uk8"; document.getElementById('race-to-select').value = d.race || "-"; } }

        function setBreak(side) { breakSide = side; updateBreakVisual(); saveDebounced(); }
        function updateBreakVisual() {
            document.getElementById('p1-txt').classList.toggle('breaking', breakSide === 1);
            document.getElementById('p2-txt').classList.toggle('breaking', breakSide === 2);
        }

        let holdT, isHold = false;
        function scStart(e, id) { if (e.cancelable) e.preventDefault(); isHold = false; holdT = setTimeout(() => { isHold = true; upd(id, -1); }, 600); }
        function scEnd(e, id) { clearTimeout(holdT); if (!isHold) { upd(id, 1, true); } }
        function upd(id, n, isWin = false) { const el = document.getElementById(id); let v = parseInt(el.innerText) + n; el.innerText = v < 0 ? 0 : v; if (isWin && n > 0) setBreak(breakSide === 1 ? 2 : 1); else saveDebounced(); }

        function performReset(e) { e.preventDefault(); lastState = { s1: document.getElementById('s1').innerText, s2: document.getElementById('s2').innerText, side: breakSide }; document.getElementById('s1').innerText = "0"; document.getElementById('s2').innerText = "0"; save(); const ub = document.getElementById('undo-btn'); ub.style.visibility = 'visible'; clearTimeout(undoTimeout); undoTimeout = setTimeout(() => { ub.style.visibility = 'hidden'; }, 5000); }
        function undoReset(e) { e.preventDefault(); if (lastState) { document.getElementById('s1').innerText = lastState.s1; document.getElementById('s2').innerText = lastState.s2; breakSide = lastState.side; updateBreakVisual(); document.getElementById('undo-btn').style.visibility = 'hidden'; lastState = null; save(); } }

        window.addEventListener('load', () => { 
            const rs = document.getElementById('race-to-select'); 
            for(let i=1; i<=21; i++) { let o = document.createElement('option'); o.value = i; o.innerText = i; rs.appendChild(o); } 
            load(); 
            document.getElementById('reset-btn').addEventListener('touchstart', performReset); 
            document.getElementById('undo-btn').addEventListener('touchstart', undoReset);
            document.getElementById('fs-toggle').addEventListener('touchstart', toggleFullscreen);
        });
    </script>
</body>
</html>
